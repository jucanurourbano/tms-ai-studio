<!DOCTYPE html>
<html lang="es">
<head><meta charset="utf-8"><title>Nueva guía</title></head>
<body>
  <h1>Nueva guía de envío</h1>

  <form id="nueva-guia" action="/guias" method="post">
    <label for="ruc">RUC del shipper</label>
    <input id="ruc" name="ruc" type="text" required maxlength="11" minlength="11" pattern="[0-9]{11}" value="">
    <span class="mensaje-error" role="alert">El RUC debe tener 11 dígitos.</span>

    <label for="destinatario">Destinatario</label>
    <input id="destinatario" name="destinatario" type="text" required maxlength="80" value="">

    <label for="ubigeo">Ubigeo de destino</label>
    <select id="ubigeo" name="ubigeo" required>
      <option value="">Seleccione…</option>
      <option value="">Lima / Lima / Miraflores</option>
      <option value="">Cusco / Cusco / Wanchaq</option>
    </select>

    <label for="peso">Peso (kg)</label>
    <input id="peso" name="peso" type="number" required min="0" max="70" step="0.01" value="">

    <fieldset>
      <legend>Tipo de servicio</legend>
      <label for="servicio-express">Express</label>
      <input id="servicio-express" name="servicio" type="radio" value="">
      <label for="servicio-regular">Regular</label>
      <input id="servicio-regular" name="servicio" type="radio" value="">
    </fieldset>

    <button data-testid="guardar" type="submit">Guardar guía</button>
    <button data-testid="cancelar" type="button">Cancelar</button>
  </form>
</body>
</html>
